<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <title>Página no encontrada | AWS Cloud Club ITP</title>
</head>
<body>
  <p><a id="home" href="/">Volver al inicio</a></p>
  <script>
    (function () {
      var base = location.pathname.indexOf('/awscloudclub/') === 0 ? '/awscloudclub/' : '/';
      var home = document.getElementById('home');
      if (home) home.href = base;
      location.replace(base);
    })();
  </script>
</body>
</html>

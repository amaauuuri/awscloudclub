<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#F8FAFC" />
  <title>Equipo Azul | AWS Cloud Club ITP</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --paper: #f8fafc;
      --surface: #ffffff;
      --ink: #0f172a;
      --muted: #64748b;
      --line: rgba(15, 23, 42, 0.13);
      --line-strong: rgba(15, 23, 42, 0.26);
      --accent: #2563eb;
      --on-accent: #ffffff;
      --sans: "Inter", ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --display: "Space Grotesk", "Inter", ui-sans-serif, system-ui, sans-serif;
      --mono: "JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
      color-scheme: light;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 32px 20px;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.6;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    h1,
    p {
      margin: 0;
    }

    ::selection {
      background: var(--accent);
      color: var(--on-accent);
    }

    :where(a):focus-visible {
      outline: 2px solid var(--ink);
      outline-offset: 3px;
    }

    .shell {
      width: min(100%, 1040px);
    }

    .team {
      display: grid;
      grid-template-columns: minmax(0, 0.82fr) minmax(0, 1.18fr);
      min-height: min(560px, calc(100vh - 64px));
      overflow: hidden;
      border: 1px solid var(--line-strong);
      border-radius: 20px;
      background: var(--surface);
    }

    .team__color {
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 40px;
      padding: 28px;
      background: var(--accent);
      color: var(--on-accent);
    }

    .team__color::after {
      content: "";
      position: absolute;
      right: -12%;
      bottom: 16%;
      width: 54%;
      aspect-ratio: 1;
      border: 1px solid currentColor;
      border-radius: 50%;
      opacity: 0.28;
      pointer-events: none;
    }

    .team__label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      font-family: var(--mono);
      font-size: 10px;
      font-weight: 500;
      letter-spacing: 0.14em;
      text-transform: uppercase;
    }

    .team__label::before {
      content: "";
      width: 7px;
      height: 7px;
      border: 1px solid currentColor;
      border-radius: 50%;
      background: currentColor;
    }

    .team__hex {
      position: relative;
      z-index: 1;
      font-family: var(--mono);
      font-size: 11px;
      font-weight: 500;
      letter-spacing: 0.06em;
      opacity: 0.88;
    }

    .team__copy {
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      gap: 48px;
      padding: clamp(28px, 4vw, 56px);
    }

    .team__copy h1 {
      max-width: 12ch;
      font-family: var(--display);
      font-size: clamp(2.7rem, 6vw, 5rem);
      font-weight: 600;
      line-height: 0.94;
      letter-spacing: -0.06em;
      overflow-wrap: anywhere;
    }

    .team__copy p {
      max-width: 32ch;
      font-size: clamp(1rem, 1.5vw, 1.15rem);
      line-height: 1.7;
      color: var(--muted);
    }

    .team__rule {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .team__rule::before,
    .team__rule::after {
      content: "";
      height: 1px;
      background: var(--line);
    }

    .team__rule::before {
      width: 32px;
      background: var(--ink);
    }

    .team__rule::after {
      flex: 1;
    }

    @media (max-width: 760px) {
      body {
        padding: 24px 16px;
        place-items: start center;
      }

      .team {
        grid-template-columns: 1fr;
        min-height: 0;
        border-radius: 16px;
      }

      .team__color {
        min-height: 172px;
        padding: 22px;
      }

      .team__color::after {
        right: -6%;
        bottom: -20%;
        width: 44%;
      }

      .team__copy {
        gap: 88px;
        padding: 28px 22px 24px;
      }

      .team__copy h1 {
        max-width: 10ch;
        font-size: clamp(2.4rem, 13vw, 3.7rem);
      }
    }
  </style>
</head>
<body>
  <main class="shell">
    <article class="team">
      <div class="team__color">
        <span class="team__label">Equipo</span>
      </div>
      <div class="team__copy">
        <div>
          <h1>Equipo Azul</h1>
          <p>Este es el equipo Azul</p>
        </div>
        <span class="team__rule" aria-hidden="true"></span>
      </div>
    </article>
  </main>
</body>
</html>
